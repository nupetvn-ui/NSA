<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Workspace</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --card: #f2f2f5;
        --line: rgb(0 0 0 / 0.1);
        --accent: #007aff;
        --green: #34c759;
        --red: #ff3b30;
        --red-bg: rgb(255 59 48 / 0.1);
        --orange-bg: rgb(255 149 0 / 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f5f5f7;
          --muted: #98989d;
          --card: #2c2c2e;
          --line: rgb(255 255 255 / 0.1);
          --accent: #0a84ff;
          --green: #30d158;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 24px 40px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 system-ui,
          'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        margin: 18px 0 8px;
      }
      #logo {
        height: 28px;
        width: 28px;
        object-fit: contain;
      }
      .pill {
        font-size: 11.5px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
      }
      .pill.ok {
        color: var(--green);
      }
      .pill.bad {
        color: var(--red);
      }
      .banner {
        margin: 14px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        line-height: 1.5;
      }
      .banner.warn {
        background: var(--orange-bg);
      }
      .banner.err {
        background: var(--red-bg);
        color: var(--red);
      }
      .card {
        background: var(--card);
        border-radius: 10px;
        padding: 8px 12px;
        margin: 6px 0;
        word-break: break-word;
      }
      .muted {
        color: var(--muted);
      }
      .bad {
        color: var(--red);
      }
      button {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      ol {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <img id="logo" src="../icon.png" alt="" />
      <h1>Google Workspace</h1>
      <span class="pill" id="conn">…</span>
      <button id="refresh" type="button">Kiểm tra</button>
    </header>
    <div id="banners"></div>
    <h2>Việc agent làm được</h2>
    <div class="card muted" id="tools"></div>
    <h2>Các lần agent gọi gần đây</h2>
    <div id="log"></div>
    <div><button id="clear" type="button">Xoá nhật ký này</button></div>
    <script src="app.js"></script>
  </body>
</html>
