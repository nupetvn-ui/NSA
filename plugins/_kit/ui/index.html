<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kênh chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --card: #f2f2f5;
        --line: rgb(0 0 0 / 0.1);
        --accent: #007aff;
        --green: #34c759;
        --orange: #ff9500;
        --red: #ff3b30;
        --red-bg: rgb(255 59 48 / 0.1);
        --orange-bg: rgb(255 149 0 / 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f5f5f7;
          --muted: #98989d;
          --card: #2c2c2e;
          --line: rgb(255 255 255 / 0.1);
          --accent: #0a84ff;
          --green: #30d158;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 24px 40px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 system-ui,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        margin: 18px 0 8px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pill {
        font-size: 11.5px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
      }
      .pill.ok {
        color: var(--green);
      }
      .pill.bad {
        color: var(--red);
      }
      .banner {
        margin: 14px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        line-height: 1.5;
      }
      .banner.warn {
        background: var(--orange-bg);
      }
      .banner.err {
        background: var(--red-bg);
        color: var(--red);
      }
      .banner ol {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      nav {
        display: flex;
        gap: 4px;
        margin: 16px 0 12px;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        background: none;
        color: var(--muted);
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      nav button.on {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 11.5px;
      }
      tr.pick {
        cursor: pointer;
      }
      tr.pick:hover td,
      tr.sel td {
        background: var(--card);
      }
      select,
      input,
      textarea {
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
      }
      button.primary {
        padding: 6px 14px;
        border: 0;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.ghost {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .card {
        background: var(--card);
        border-radius: 10px;
        padding: 10px 12px;
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .muted {
        color: var(--muted);
      }
      .lv-error {
        color: var(--red);
      }
      .lv-warn {
        color: var(--orange);
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 20px;
      }
      @media (max-width: 760px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      .msg {
        min-height: 1.4em;
        color: var(--muted);
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Kênh chat</h1>
      <span class="pill" id="conn">…</span>
      <span class="pill" id="tick"></span>
      <button class="ghost" id="refresh" type="button">Kiểm tra ngay</button>
    </header>
    <div id="banners"></div>
    <nav id="tabs"></nav>
    <p class="msg" id="msg"></p>
    <main id="view"></main>
    <script src="app.js"></script>
  </body>
</html>
