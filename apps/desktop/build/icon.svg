<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo NSA: lõi ở giữa điều phối ba agent. Nguồn gốc của mọi file icon; sửa ở đây rồi chạy lệnh icons của apps/desktop. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- Đường nối lõi ↔ agent -->
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="268" x2="256" y2="132"/>
    <line x1="256" y1="268" x2="138" y2="336"/>
    <line x1="256" y1="268" x2="374" y2="336"/>
  </g>

  <!-- Ba agent -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="124" r="46"/>
    <circle cx="131" cy="340" r="46"/>
    <circle cx="381" cy="340" r="46"/>
  </g>

  <!-- Lõi NSA -->
  <circle cx="256" cy="268" r="62" fill="#FFFFFF"/>
  <circle cx="256" cy="268" r="30" fill="#4338CA"/>
</svg>
